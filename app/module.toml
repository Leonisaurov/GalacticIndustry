version = 2

# Puente para CodeAssist: el layout canónico es el de apkc (raíz del repo), pero
# CodeAssist espera un módulo `app` con su module.toml. Las rutas suben un nivel.
# No muevas estas rutas: apkc y CodeAssist comparten los mismos ficheros.

[module]
type = "android-app"
name = "app"
languageLevel = "JAVA_17"
output = "build/classes"

[sourceSets.androidTest]
scope = "TEST_IMPLEMENTATION"
java = ["src/androidTest/java", "src/androidTest/kotlin"]
resources = ["src/androidTest/resources"]

[sourceSets.debug]
scope = "IMPLEMENTATION"
aidl = ["src/debug/aidl"]
assets = ["src/debug/assets"]
java = ["src/debug/java", "src/debug/kotlin"]
jniLibs = ["src/debug/jniLibs"]
res = ["src/debug/res"]
resources = ["src/debug/resources"]

[sourceSets.main]
scope = "IMPLEMENTATION"
assets = ["../assets"]
java = ["../src"]
jniLibs = ["../lib"]
res = ["../res"]

[sourceSets.release]
scope = "IMPLEMENTATION"
aidl = ["src/release/aidl"]
assets = ["src/release/assets"]
java = ["src/release/java", "src/release/kotlin"]
jniLibs = ["src/release/jniLibs"]
res = ["src/release/res"]
resources = ["src/release/resources"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/test/java", "src/test/kotlin"]
resources = ["src/test/resources"]

[dependencies]
implementation = ["com.badlogicgames.gdx:gdx:1.14.2", "com.badlogicgames.gdx:gdx-backend-android:1.14.2"]

[android]
namespace = "com.example.codegame"
compileSdk = 36
minSdk = 26
targetSdk = 36
manifest = "../AndroidManifest.xml"
isApplication = true
